; Export presets for Redline.
;
; Committed rather than left to each machine, so a release is one command with
; the same contents everywhere.
;
; Note what is not here: an include filter for data/. That folder is a GM's own
; book-derived material and must never reach a build. The tables Redline ships
; live in catalog/, which carries no .gdignore and is packed by the ordinary
; resource filter.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*, .shots/*"
export_path="dist/redline-linux.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

