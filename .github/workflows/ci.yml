# Runs the two suites that already existed in this repo but had nothing to run
# them: ./run-tests.sh (GDScript, via a headless Godot) and
# ./run-assistant-tests.sh (pytest plus the release-content audit).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Must match config/features in project.godot. Bump both together, and check
  # the release actually publishes this asset name before relying on the job.
  GODOT_VERSION: "4.7"

jobs:
  python:
    name: Python suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: assistant/requirements-dev.txt

      - name: Install the helper's dependencies
        run: pip install -r assistant/requirements-dev.txt

      - name: Lint
        run: pip install ruff && ruff check .

      # Both of these were advisory ratchets until the tree reached clean
      # against them. Formatting and types are the two a reviewer should never
      # have to think about, so they block now.
      - name: Format
        run: ruff format --check .

      - name: Types
        run: pip install mypy && mypy --ignore-missing-imports assistant service scripts/audit_export.py

      # Runs pytest over tests/assistant and tests/service, then the audit that
      # checks no rulebook text or credential reached a release artifact.
      - name: Test
        run: ./run-assistant-tests.sh

  godot:
    name: GDScript suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The headless binary still links against these; a bare runner image does
      # not always carry them.
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 fontconfig

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          base="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${base}.zip"
          echo "Fetching $url"
          curl -fL --retry 3 -o godot.zip "$url"
          unzip -q godot.zip
          mkdir -p "$HOME/.local/bin"
          mv "$base" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show the engine version
        run: godot --version

      - name: Lint
        run: |
          pip install "gdtoolkit==4.*"
          gdlint $(git ls-files '*.gd')

      # run-tests.sh imports the project first, then runs res://tests/run_tests.gd,
      # which exits non-zero on any failed check.
      - name: Test
        run: ./run-tests.sh

      # The rules suite proves the rules hold; this proves the screens that use
      # them draw, and that the paths a GM clicks still work end to end. Godot
      # cannot render under --headless, hence the framebuffer.
      - name: Install a framebuffer
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Screens
        run: ./run-screens.sh

      # Worth keeping when a screen changes shape: the diff is easier to read as
      # a picture than as a description of one.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: .shots/
          if-no-files-found: warn
          # .shots is a dot-directory, and v4 skips hidden files by default —
          # without this the step uploads nothing and only warns about it.
          include-hidden-files: true

  ratchets:
    name: Ratchets (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the tools
        run: pip install "gdtoolkit==4.*"

      # Writes what the tool would change into the run summary and always
      # succeeds. A red X here would read as "this PR is broken" when it means
      # "the codebase has not adopted this yet", so drift is reported rather
      # than enforced. When one reaches clean, move it into the blocking jobs
      # above and delete it from here — which is what happened to ruff format
      # and mypy, both of which now block.
      #
      # gdformat is the one left: it would reformat seventy files, which is a
      # commit of its own rather than a line in somebody else's pull request.
      - name: Report drift
        run: |
          report() {
            title="$1"
            shift
            if output=$("$@" 2>&1); then
              echo "- **$title** — clean, ready to enforce" >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "<details><summary><b>$title</b> — drift</summary>"
                echo
                echo '```'
                echo "$output" | tail -50
                echo '```'
                echo
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          {
            echo "## Ratchets"
            echo
            echo "Advisory. None of this blocks a merge."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          report "GDScript formatting (gdformat)" \
            bash -c "gdformat --check \$(git ls-files '*.gd')"
