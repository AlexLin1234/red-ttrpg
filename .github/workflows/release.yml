# Build the app itself.
#
# The README has always documented how to build the assistant helper and never
# how to build Redline, because there was no way to. This exports all three
# desktop builds from the committed presets, builds the helper beside them, and
# runs the release audit over the result — the same audit that fails a release
# carrying a book, an index, extracted text or a credential.
#
# Runs on a tag, and on demand for a dry run that publishes nothing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"
  PYTHON_VERSION: "3.11"

jobs:
  export:
    name: Export ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Linux
            artifact: redline-linux
          - preset: Windows
            artifact: redline-windows
          - preset: macOS
            artifact: redline-macos
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 fontconfig

      # The editor build does the exporting; the templates are what it exports
      # with, and they have to sit exactly where Godot looks for them.
      - name: Install Godot ${{ env.GODOT_VERSION }} and its export templates
        run: |
          set -euo pipefail
          base="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 -o godot.zip "$release/${base}.zip"
          unzip -q godot.zip
          mkdir -p "$HOME/.local/bin"
          mv "$base" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          curl -fL --retry 3 -o templates.tpz \
            "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$target"
          mv templates/* "$target/"

      # A newly added class_name is invisible to the compiler until the global
      # class cache is rebuilt, which the export would otherwise trip over.
      - name: Import the project
        run: godot --headless --path . --import

      - name: Export
        run: |
          set -euo pipefail
          mkdir -p dist
          godot --headless --path . --export-release "${{ matrix.preset }}"
          ls -la dist

      # The app reads data/*.json at runtime and data/ carries a .gdignore, so
      # this is the one thing an export can silently get wrong.
      - name: Check the data files reached the build
        run: |
          set -euo pipefail
          for file in dist/*; do
            if grep -aq "items.json" "$file"; then
              echo "$file carries the item catalog"
              exit 0
            fi
          done
          echo "no exported build carries data/items.json" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  helper:
    name: Assistant helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the helper's dependencies
        run: pip install -r assistant/requirements-dev.txt

      - name: Build
        run: python assistant/packaging/build_helper.py

      # Nothing in a release may carry a book, an index, extracted text or a
      # credential. The audit is the gate that says so.
      - name: Audit
        run: python scripts/audit_export.py

      - uses: actions/upload-artifact@v4
        with:
          name: redline-assistant-linux
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [export, helper]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
