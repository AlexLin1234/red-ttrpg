# GitHub's static analysis. Python only — there is no GDScript support, so this
# covers assistant/, service/ and scripts/, not the engine-side rules.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Catches newly published rules against unchanged code.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  # codeql-action reads the workflow run it is part of. On a private repository
  # that call is not covered by the default token, and without this the analysis
  # completes and then reports "Resource not accessible by integration".
  actions: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: github/codeql-action/analyze@v3
